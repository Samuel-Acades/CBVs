{% extends "base.html" %}
{% block title %}Login · ACADES CBV Dashboard{% endblock %}
{% block body_class %}login-page{% endblock %}
{% block content %}
<div class="login-wrap">
  <div class="login-card">
    <h1>ACADES CBV Dashboard</h1>
    <div class="sub">Sign in to continue</div>
    {% if error %}<div class="login-err">{{ error }}</div>{% endif %}
    <form method="post" action="/login">
      <input type="hidden" name="next" value="{{ next or '/' }}">
      <div class="field"><label>Username</label><input type="text" name="username" autofocus required></div>
      <div class="field"><label>Password</label><input type="password" name="password" required></div>
      <button class="btn" type="submit">Log in</button>
    </form>
  </div>
</div>
<style>.main { padding: 0; }</style>
{% endblock %}
